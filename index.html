<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPEN-RPGFXS · 최종 패키지</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101921;color:#edf5fa;font:15px system-ui,sans-serif}header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid #30424f;flex-wrap:wrap}header strong{letter-spacing:1px}header small{color:#9cb7c6}button,select,input{font:inherit;color:inherit;background:#203340;border:1px solid #436070;border-radius:8px;padding:9px;min-height:40px}button{cursor:pointer}button:hover{background:#315267}.load{margin-left:auto;background:#254f4a}main{display:grid;grid-template-columns:250px minmax(400px,1fr) minmax(300px,420px);gap:16px;padding:16px;height:calc(100dvh - 73px)}aside,section{min-height:0;min-width:0}.nav{display:flex;flex-direction:column;gap:9px}.nav select{flex:1;min-height:200px}.nav option{padding:8px}.nav #scope{flex:0;min-height:40px;height:40px}.nav #list{flex:1}.stage{display:flex;flex-direction:column;align-items:center;gap:10px}.canvas{width:min(100%,52vh);aspect-ratio:1;background:repeating-conic-gradient(#22313e 0% 25%,#1c2933 0% 50%) 50%/24px 24px;border:1px solid #44606e;image-rendering:pixelated}#view{width:100%;height:100%}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(420px,100%)}.primary{background:#296354}#timeline{width:100%;height:126px;background:#132430;border:1px solid #3d5664;border-radius:8px}.info{overflow:auto;padding:10px;background:#15232e;border-radius:12px}.pill{color:#8eedc4;font-weight:bold}h1{font-size:20px;margin:4px 0 12px}p{line-height:1.5}code{color:#9de1ef;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #314957;padding:6px;text-align:left}a{color:#9cdefa}.hint{color:#9fb6c3;font-size:13px}#status{min-height:24px;margin:0}#name{font-weight:bold}.links{display:flex;gap:14px;margin:12px 0}textarea{width:100%;height:100px;background:#0b141c;color:white}#error{color:#ffbe94}#folder{display:none}#time{font-variant-numeric:tabular-nums}#scrub{width:100%;padding:0;min-height:24px} @media(max-width:1000px){main{grid-template-columns:190px 1fr}.info{grid-column:1/-1;max-height:36vh}main{height:auto;min-height:calc(100dvh - 73px)}.nav select{height:430px}.canvas{width:320px}}@media(max-width:600px){header{padding:10px}.load{margin-left:0}main{display:flex;flex-direction:column;padding:10px;gap:10px}.nav select{height:55px;min-height:55px;flex:auto}.nav{display:grid;grid-template-columns:1fr 1fr}.canvas{width:min(80vw,38vh)}.info{max-height:40vh}.stage{gap:6px}#timeline{height:100px}.controls{grid-template-columns:repeat(4,1fr)}h1{font-size:17px}button{padding:7px}}
</style>
<header><strong>OPEN-RPGFXS</strong><small>440 통과 조합 · 315 시트 · 246 WAV</small><button class="load" id="load">패키지 폴더 선택</button><input id="folder" type="file" webkitdirectory multiple></header>
<main><aside class="nav"><input id="search" placeholder="품번 · 이름 · 속성 검색"><select id="scope"><option value="all">전체 통과 조합</option><option value="primary">본 후보</option><option value="comparison">통과 대체안</option></select><select id="list" size="18" aria-label="조합 목록"></select></aside>
<section class="stage"><div id="name"></div><div class="canvas"><canvas id="view" width="384" height="384"></canvas></div><div class="controls"><button id="prev">← 이전 조합</button><button id="next">다음 조합 →</button><button id="play" class="primary">▶ 함께 재생</button><button id="stop">■ 정지</button></div><input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="프레임 위치"><span id="time">0ms</span><canvas id="timeline" width="1000" height="150"></canvas><p id="status" class="hint">로컬 파일 재생은 패키지 폴더를 한 번 선택하세요.</p><p id="error"></p></section>
<section class="info"><span class="pill">검수 통과 · 원본 연결 확인</span><h1 id="title"></h1><code id="codes"></code><p id="summary"></p><div class="links"><a id="sheet" target="_blank">시트</a><a id="meta" target="_blank">페어링 JSON</a><a id="doc" target="_blank">사용 문서</a></div><table><thead><tr><th>음원</th><th>시작</th><th>gain</th><th>길이</th></tr></thead><tbody id="routes"></tbody></table><p id="impacts"></p><p id="tail" class="hint"></p><p class="hint">주황: 타격·동작 / 보라: 본음 후보 / 빨강: 최대 진폭. 최대 진폭을 타격 시점으로 간주하지 않습니다.</p><label>같은 이미지의 통과 대체 조합 <select id="alternatives"></select></label><p class="hint">로컬 재생은 네트워크 전송 없이 선택한 폴더에서 읽습니다. 모든 자름·페이드는 WAV에 반영되어 있습니다.</p><button id="copy">현재 재생표 JSON 복사</button><textarea id="copyText" hidden></textarea></section></main>
<script src="doc/preview-data.js"></script><script>
'use strict';
const $=s=>document.querySelector(s),D=window.OPEN_RPGFXS,ctx=$('#view').getContext('2d'),tc=$('#timeline').getContext('2d');ctx.imageSmoothingEnabled=false;
let chosen=null,filtered=[],files=new Map(),urls=new Map(),buffers=new Map(),images=new Map(),ac=null,sources=[],raf=0,serial=0,currentTime=0;
function fileURL(path){if(files.has(path)){if(!urls.has(path))urls.set(path,URL.createObjectURL(files.get(path)));return urls.get(path)}return path}
function stop(){serial++;cancelAnimationFrame(raf);for(const s of sources)try{s.stop()}catch{}sources=[]}
function resetCaches(){stop();for(const u of urls.values())URL.revokeObjectURL(u);urls.clear();buffers.clear();images.clear()}
async function picture(path){if(images.has(path))return images.get(path);const im=new Image();im.src=fileURL(path);await im.decode();if(images.size>8)images.clear();images.set(path,im);return im}
async function audio(path){if(buffers.has(path))return buffers.get(path);let bytes;if(files.has(path))bytes=await files.get(path).arrayBuffer();else if(location.protocol!=='file:'){const r=await fetch(path);if(!r.ok)throw Error('음원 파일을 읽을 수 없습니다.');bytes=await r.arrayBuffer()}else throw Error('위의 “패키지 폴더 선택”에서 ZIP을 푼 OPEN-RPGFXS 폴더를 선택하세요.');const b=await ac.decodeAudioData(bytes);if(buffers.size>20)buffers.clear();buffers.set(path,b);return b}
function list(){const q=$('#search').value.toLowerCase(),scope=$('#scope').value;filtered=D.pairings.filter(p=>(scope==='all'||p.role===scope)&&[p.name_ko,p.source_id,p.code,...p.concepts].join(' ').toLowerCase().includes(q));$('#list').replaceChildren(...filtered.map(p=>{const o=document.createElement('option');o.value=p.code;o.textContent=p.source_id+' · '+p.name_ko+(p.level?' · Lv.'+p.level:'');return o}));if(filtered.length)select(filtered.find(p=>p.code===chosen?.code)?.code||filtered[0].code)}
async function select(code){stop();const p=D.pairings.find(p=>p.code===code);if(!p)return;chosen=p;$('#list').value=code;$('#name').textContent=p.source_id+' · '+(p.level?'Lv.'+p.level:'강도 미지정');$('#title').textContent=p.name_ko;$('#codes').textContent=p.code+' → '+p.animation;$('#summary').textContent='384×384 · '+p.timing.duration_ms.toFixed(1)+'ms · '+p.timing.fps+' FPS'+(D.animations[p.animation].frame_durations_ms?' · 가변 프레임 길이':'');$('#sheet').href=fileURL(p.sheet);$('#meta').href=fileURL('pairings/'+code+'.json');$('#doc').href=fileURL('pairings/'+code+'.md');$('#routes').replaceChildren(...p.routes.map(r=>{const tr=document.createElement('tr');const name=document.createElement('td');const a=document.createElement('a');a.href=fileURL(r.file);a.target='_blank';a.textContent=r.audio;name.append(a);tr.append(name);for(const value of [r.start_ms.toFixed(1)+'ms',r.gain.toFixed(3),r.duration_ms.toFixed(1)+'ms']){const td=document.createElement('td');td.textContent=value;tr.append(td)}return tr}));$('#impacts').textContent='타격·동작: '+(p.timing.impact_events.map(e=>e.time_ms.toFixed(1)+'ms ['+e.confidence+']').join(' / ')||'지속 효과')+' · 간격 '+p.timing.impact_intervals_ms.map(x=>x.toFixed(1)).join(', ')+'ms';$('#tail').textContent='사전 재생 '+p.timing.pre_roll_ms.toFixed(1)+'ms / 영상 뒤 잔음 '+p.timing.audio_tail_after_animation_ms.toFixed(1)+'ms';$('#alternatives').replaceChildren(...[p.code,...p.alternatives].map(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;o.selected=c===p.code;return o}));$('#error').textContent='';$('#scrub').max=p.timing.duration_ms;$('#scrub').value=0;$('#time').textContent='0ms';currentTime=0;try{const im=await picture(p.sheet);if(chosen===p)draw(im,p,0)}catch(e){$('#error').textContent=e.message}paint(0)}
function draw(im,p,t){const a=D.animations[p.animation];ctx.clearRect(0,0,384,384);if(t<0||t>=p.timing.duration_ms)return;let i;if(a.frame_durations_ms){let sum=0;i=0;while(i<a.frame_count-1&&sum+a.frame_durations_ms[i]<=t){sum+=a.frame_durations_ms[i];i++}}else i=Math.floor(t*a.fps/1000);i=Math.min(a.frame_count-1,i);ctx.drawImage(im,(i%a.columns)*384,Math.floor(i/a.columns)*384,384,384,0,0,384,384)}
function paint(t){if(!chosen)return;const p=chosen,w=1000,h=150,lo=-p.timing.pre_roll_ms,hi=Math.max(p.timing.duration_ms,...p.routes.map(r=>r.end_ms)),X=x=>30+(x-lo)/(hi-lo)*940;tc.clearRect(0,0,w,h);tc.fillStyle='#487eb0';tc.fillRect(X(0),15,X(p.timing.duration_ms)-X(0),22);tc.fillStyle='#b8d0dc';tc.font='16px sans-serif';tc.fillText('애니메이션',33,31);for(const r of p.routes){const b=buffers.get(r.file);if(b){const y=b.getChannelData(0),step=Math.max(1,Math.floor(y.length/500));tc.strokeStyle='#76d7bf';tc.beginPath();for(let i=0;i<y.length;i+=step){let peak=0;for(let j=i;j<Math.min(i+step,y.length);j++)peak=Math.max(peak,Math.abs(y[j])*r.gain);const x=X(r.start_ms+i/b.sampleRate*1000);tc.moveTo(x,85-Math.min(1,peak)*32);tc.lineTo(x,85+Math.min(1,peak)*32)}tc.stroke()}for(const [ms,color] of [[r.main_onset_timeline_ms,'#c895ff'],[r.sample_peak_timeline_ms,'#f27474']]){tc.strokeStyle=color;tc.beginPath();tc.moveTo(X(ms),50);tc.lineTo(X(ms),123);tc.stroke()}}for(const e of p.timing.impact_events){tc.strokeStyle='#ffb052';tc.lineWidth=2;tc.beginPath();tc.moveTo(X(e.time_ms),5);tc.lineTo(X(e.time_ms),125);tc.stroke()}tc.lineWidth=1;tc.strokeStyle='white';tc.beginPath();tc.moveTo(X(t),0);tc.lineTo(X(t),130);tc.stroke();tc.fillStyle='#bbced8';for(let i=0;i<5;i++){let ms=lo+(hi-lo)*i/4;tc.fillText(ms.toFixed(0)+'ms',Math.min(900,X(ms)),145)}}
async function play(){stop();const p=chosen,token=serial;if(!p)return;try{ac=ac||new AudioContext({sampleRate:48000});await ac.resume();const im=await picture(p.sheet),bs=await Promise.all(p.routes.map(r=>audio(r.file)));if(token!==serial||p!==chosen)return;const base=ac.currentTime+.15+p.timing.pre_roll_ms/1000;for(let i=0;i<p.routes.length;i++){const r=p.routes[i],s=ac.createBufferSource(),g=ac.createGain();s.buffer=bs[i];g.gain.value=r.gain;s.connect(g).connect(ac.destination);s.start(base+r.start_ms/1000);sources.push(s)}$('#status').textContent='검수된 자름·페이드·시작·게인으로 재생 중';function tick(){if(token!==serial)return;const t=(ac.currentTime-base)*1000;currentTime=t;draw(im,p,t);paint(t);$('#time').textContent=t.toFixed(0)+'ms';$('#scrub').value=Math.max(0,Math.min(t,p.timing.duration_ms));if(t<Math.max(p.timing.duration_ms,...p.routes.map(r=>r.end_ms)))raf=requestAnimationFrame(tick);else{$('#status').textContent='재생 완료';sources=[]}}tick()}catch(e){$('#error').textContent=e.message}}
$('#load').onclick=()=>$('#folder').click();$('#folder').onchange=async e=>{resetCaches();files=new Map();for(const f of e.target.files){const parts=f.webkitRelativePath.split('/');parts.shift();files.set(parts.join('/'),f)}if(!files.has('doc/manifest.json')){$('#error').textContent='OPEN-RPGFXS 폴더 자체를 선택하세요.';return}$('#status').textContent='패키지 연결 완료 · '+files.size+'개 파일 · 로컬 전용';await select(chosen.code)};
$('#play').onclick=play;$('#stop').onclick=()=>{stop();$('#status').textContent='정지'};$('#list').onchange=e=>select(e.target.value);$('#alternatives').onchange=e=>select(e.target.value);$('#search').oninput=list;$('#scope').onchange=list;function next(d){let i=filtered.findIndex(p=>p.code===chosen?.code);select(filtered[(i+d+filtered.length)%filtered.length]?.code)}$('#prev').onclick=()=>next(-1);$('#next').onclick=()=>next(1);$('#scrub').oninput=async e=>{stop();const p=chosen;currentTime=Number(e.target.value);const im=await picture(p.sheet);draw(im,p,currentTime);paint(currentTime);$('#time').textContent=currentTime.toFixed(1)+'ms'};document.onkeydown=e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight')next(1);if(e.key==='ArrowLeft')next(-1);if(e.key===' '){e.preventDefault();play()}};$('#copy').onclick=async()=>{const text=JSON.stringify({pairing:chosen.code,animation:chosen.animation,timing:chosen.timing,routes:chosen.routes},null,2);try{await navigator.clipboard.writeText(text);$('#status').textContent='재생표 JSON 복사 완료'}catch{$('#copyText').hidden=false;$('#copyText').value=text;$('#copyText').select()}};list();
</script></html>
